[extend]
useDefault = true

[[allowlists]]
description = "Clé d'idempotence publique et déterministe du test de réseau normalisé"
regexes = ['''calcul-reseau-normalise-001''']

[[allowlists]]
description = """
Mot de passe de jeu d'essai introduit par le commit 56b3554 dans la suite
d'authentification. Il ne donne accès à rien : chaque exécution des tests crée sa
