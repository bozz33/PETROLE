# Infrastructure jetable de qualification PostgreSQL/PostGIS (ADR-TEST-DB-001).
#
# La base est distincte de tout environnement applicatif, stockée en tmpfs et
# migrée exclusivement par Alembic avant le lancement des tests.
name: petrole-tests

services:
  postgres-test:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: petrole_test
      POSTGRES_USER: petrole_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U petrole_test -d petrole_test"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - test

  migrate-test:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
      target: development
    command: ["alembic", "-c", "/workspace/alembic.ini", "upgrade", "head"]
    environment:
      HYDRO_DATABASE_URL: "postgresql+psycopg://petrole_test:test-only-password@postgres-test/petrole_test"
      HYDRO_ENVIRONMENT: test
    volumes:
      - type: bind
        source: ..
        target: /workspace
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - test

  tests:
    profiles: [tests]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
      target: development
    command:
      [
        "pytest",
        "-m", "not slow",
        "-p", "no:cacheprovider",
        "-q"
      ]
    environment:
      HYDRO_TEST_DATABASE_URL: "postgresql+psycopg://petrole_test:test-only-password@postgres-test/petrole_test"
      HYDRO_DATABASE_URL: "postgresql+psycopg://petrole_test:test-only-password@postgres-test/petrole_test"
      HYDRO_ENVIRONMENT: test
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - type: bind
        source: ..
        target: /workspace
    user: "${QUALIFICATION_UID:-1000}:${QUALIFICATION_GID:-1000}"
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    networks:
      - test

networks:
  test:
