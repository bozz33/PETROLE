name: Finaliser la navigation réseau

on:
  push:
    branches:
      - feature/frontend-shadcn-admin
    paths:
      - .github/workflows/patch-network-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          ref: feature/frontend-shadcn-admin
          fetch-depth: 0

      - name: Ajouter la page réseau au shell
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/Shell.tsx")
          content = path.read_text(encoding="utf-8")

          navigation_anchor = '''  {
            to: "/modelisation",
            label: "Modélisation",
            icon: "network",
            description: "Réseaux, tronçons et équipements",
          },
          '''
          navigation_replacement = navigation_anchor + '''  {
            to: "/reseau",
            label: "Visualisation du réseau",
            icon: "network",
            description: "Schéma technologique et cartographie",
          },
          '''

          metadata_anchor = '''  "/modelisation": {
            title: "Modélisation",
            subtitle: "Construire et valider le réseau, ses tronçons et ses équipements.",
          },
          '''
          metadata_replacement = metadata_anchor + '''  "/reseau": {
            title: "Visualisation du réseau",
            subtitle: "Explorer le schéma technologique et la cartographie du pipeline.",
          },
          '''

          if 'to: "/reseau"' not in content:
              if navigation_anchor not in content:
                  raise SystemExit("Point d'insertion de la navigation introuvable")
              content = content.replace(navigation_anchor, navigation_replacement, 1)

          if '"/reseau": {' not in content:
              if metadata_anchor not in content:
                  raise SystemExit("Point d'insertion des métadonnées introuvable")
              content = content.replace(metadata_anchor, metadata_replacement, 1)

          path.write_text(content, encoding="utf-8")
          PY

      - name: Valider le frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck

      - name: Committer et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/Shell.tsx
          git rm .github/workflows/patch-network-navigation.yml
          git commit -m "feat(frontend): expose la visualisation réseau dans le shell"
          git push origin HEAD:feature/frontend-shadcn-admin
